name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./ci.db
      JWT_SECRET: clave-de-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Formato de imports y estilo
        run: ruff format --check .

      - name: Migraciones al dia con los modelos
        # Falla si alguien edito un modelo sin generar la migracion correspondiente.
        run: |
          alembic upgrade head
          alembic check

      - name: Pruebas
        run: pytest
